[project]
name = "flgo"
version = "0.2.0"
description = "飞灵（FLGO）：local Feishu/Lark work assistant powered by Gemini and OpenAI-compatible models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "beautifulsoup4>=4.13.0",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "lark-oapi>=1.4.0",
    "openpyxl>=3.1.0",
    "pillow>=11.0.0",
    "pypdf>=6.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "python-pptx>=1.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[project.scripts]
flgo = "flgo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flgo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated.*:DeprecationWarning:lark_oapi\\.ws\\.pb\\.google\\.protobuf\\.internal\\.well_known_types",
    "ignore:There is no current event loop:DeprecationWarning:lark_oapi\\.ws\\.client",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
packages = ["flgo"]
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "lark_oapi", "lark_oapi.*", "openpyxl", "openpyxl.*", "PIL", "PIL.*", "pptx", "pptx.*"]
ignore_missing_imports = true
